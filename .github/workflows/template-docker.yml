name: Reusable Docker build, scan, and signing workflow

on:
  workflow_call:
    inputs:
      dockerfile_path:
        description: "Dockerfile path relative to the repository root"
        required: false
        type: string
        default: ./Dockerfile
      docker_push:
        description: "Push the image; false still performs the Docker build"
        required: false
        type: boolean
        default: false
      image_name:
        description: "Image name without registry or organization"
        required: true
        type: string
      version:
        description: "Image tag, such as 1.2.3 or v1.2.3"
        required: true
        type: string
      registry:
        description: "Supported registry: ghcr.io or docker.io"
        required: false
        type: string
        default: docker.io
      organization:
        description: "GHCR owner or Docker Hub namespace"
        required: true
        type: string
      platforms:
        description: "Comma-separated BuildKit target platforms"
        required: false
        type: string
        default: linux/amd64,linux/arm64
      machinarchy_command:
        description: "Dockerfile build target: api, controlmanager, monolit, machinarchy, or agent"
        required: false
        type: string
        default: api
    secrets:
      DOCKER_USERNAME:
        description: "Docker Hub username; required only for docker.io pushes"
        required: false
      DOCKER_PASSWORD:
        description: "Docker Hub access token; required only for docker.io pushes"
        required: false

permissions: {}

jobs:
  pre-flight:
    name: Validate inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.validate.outputs.image_ref }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs and Dockerfile
        id: validate
        shell: bash
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          REGISTRY: ${{ inputs.registry }}
          ORGANIZATION_INPUT: ${{ inputs.organization }}
          IMAGE_NAME_INPUT: ${{ inputs.image_name }}
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          MACHINARCHY_COMMAND: ${{ inputs.machinarchy_command }}
          DOCKER_PUSH: ${{ inputs.docker_push }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -f "$DOCKERFILE_PATH" ]] || {
            echo "::error file=${DOCKERFILE_PATH}::Dockerfile not found."
            exit 1
          }

          case "$REGISTRY" in
            ghcr.io|docker.io) ;;
            *) echo "::error::Unsupported registry '$REGISTRY'."; exit 1 ;;
          esac

          ORGANIZATION="$(printf '%s' "$ORGANIZATION_INPUT" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="$(printf '%s' "$IMAGE_NAME_INPUT" | tr '[:upper:]' '[:lower:]')"

          [[ "$ORGANIZATION" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "::error::Invalid registry namespace/organization: $ORGANIZATION_INPUT"
            exit 1
          }
          [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "::error::Invalid image name: $IMAGE_NAME_INPUT"
            exit 1
          }
          [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error::Invalid Docker tag: $VERSION"
            exit 1
          }
          [[ -n "$PLATFORMS" && "$PLATFORMS" =~ ^[a-zA-Z0-9_./,-]+$ ]] || {
            echo "::error::Invalid or empty platforms value: $PLATFORMS"
            exit 1
          }
          case "$MACHINARCHY_COMMAND" in
            api|controlmanager|monolit|machinarchy|agent) ;;
            *) echo "::error::Unsupported Machinarchy command target: $MACHINARCHY_COMMAND"; exit 1 ;;
          esac

          if [[ "$DOCKER_PUSH" == "true" && "$REGISTRY" == "docker.io" ]]; then
            [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]] || {
              echo "::error::DOCKER_USERNAME and DOCKER_PASSWORD are required for Docker Hub publishing."
              exit 1
            }
          fi

          echo "image_ref=${REGISTRY}/${ORGANIZATION}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Validated image: ${REGISTRY}/${ORGANIZATION}/${IMAGE_NAME}:${VERSION}"

  docker-build-push:
    name: Docker build${{ inputs.docker_push && ' and push' || '' }}
    needs: pre-flight
    if: >-
      ${{
        !contains(github.event.head_commit.message || '', '[docker skip]') &&
        !contains(github.event.pull_request.title || '', '[docker skip]')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ needs.pre-flight.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Calculate build metadata
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "build_time=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: ${{ inputs.docker_push && inputs.registry == 'docker.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.docker_push && inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ needs.pre-flight.outputs.image_ref }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.docker_push }}
            type=ref,event=branch
            type=sha,prefix=sha-

      # docker_push=false builds and validates the image but does not push or
      # load a multi-platform manifest into the runner's local Docker image store.
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.docker_push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build-meta.outputs.build_time }}
            MACHINARCHY_COMMAND=${{ inputs.machinarchy_command }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
          provenance: ${{ inputs.docker_push }}
          sbom: ${{ inputs.docker_push }}

  security-scan:
    name: Scan published image by digest
    needs: docker-build-push
    if: ${{ inputs.docker_push && needs.docker-build-push.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to Docker Hub
        if: ${{ inputs.registry == 'docker.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Scan the exact published digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.docker-build-push.outputs.image_ref }}@${{ needs.docker-build-push.outputs.image_digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy results to GitHub code scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true # SARIF upload is supplemental; Trivy's exit code gates signing.
        with:
          sarif_file: trivy-results.sarif

  sign-image:
    name: Sign published image digest with Cosign
    needs:
      - docker-build-push
      - security-scan
    if: >-
      ${{
        inputs.docker_push &&
        needs.docker-build-push.result == 'success' &&
        needs.security-scan.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to Docker Hub
        if: ${{ inputs.registry == 'docker.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign exact image digest using GitHub OIDC
        shell: bash
        env:
          IMAGE_REF: ${{ needs.docker-build-push.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.docker-build-push.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Build did not return a valid sha256 image digest; refusing to sign."
            exit 1
          }
          cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"
