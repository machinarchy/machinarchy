name: CI

on:
  push:
    # main is the stable channel; beta and alpha publish pre-releases
    # (.github/WORKFLOWS.md, "Release channels").
    branches: [main, beta, alpha]
  pull_request:

# Default-deny; jobs grant only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.1.4
  GOSEC_VERSION: v2.22.4
  # machinarchy imports github.com/machinarchy/machinarchy-agent/protocol
  # through `replace ../machinarchy-agent/protocol`, so every job checks out
  # both repositories side by side. Set the repository variable
  # MACHINARCHY_AGENT_REF to pin the agent revision; a private agent
  # repository needs the AGENT_REPO_TOKEN secret (read access).
  AGENT_REF: ${{ vars.MACHINARCHY_AGENT_REF || 'main' }}

jobs:
  verify:
    name: Build, vet, lint, race tests, coverage, e2e
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: machinarchy
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: machinarchy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d machinarchy_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MACHINARCHY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/machinarchy_test?sslmode=disable
      MACHINARCHY_REQUIRE_POSTGRES_TESTS: "1"
      # The agent end-to-end test must run, not skip.
      MACHINARCHY_E2E_REQUIRED: "1"
    steps:
      - name: Checkout machinarchy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: machinarchy
          persist-credentials: false

      - name: Checkout machinarchy-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/machinarchy-agent
          ref: ${{ env.AGENT_REF }}
          path: machinarchy-agent
          token: ${{ secrets.AGENT_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: machinarchy/go.mod
          cache: true
          cache-dependency-path: |
            machinarchy/go.sum
            machinarchy-agent/go.sum

      - name: Modules are tidy and verified
        run: make tidy-check

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      # Includes the PostgreSQL contract suites, the OpenAPI route-coverage
      # check and the agent end-to-end test (test/e2e).
      - name: Race tests with coverage
        run: make coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4 # tag: no verified SHA available offline; pin with Dependabot
        with:
          name: machinarchy-coverage
          path: machinarchy/coverage.out
          retention-days: 14

      - name: CLI smoke test against a fresh monolith
        run: make smoke

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Lint (golangci-lint, includes gosec rules)
        run: make lint

  security:
    name: govulncheck, gosec, fuzz smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: machinarchy
    steps:
      - name: Checkout machinarchy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: machinarchy
          persist-credentials: false

      - name: Checkout machinarchy-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/machinarchy-agent
          ref: ${{ env.AGENT_REF }}
          path: machinarchy-agent
          token: ${{ secrets.AGENT_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: machinarchy/go.mod
          cache: true
          cache-dependency-path: machinarchy/go.sum

      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}

      # Fails on called vulnerabilities unless a reviewed, unexpired entry in
      # scripts/security/govulncheck-allowlist.txt accepts one with no fix.
      - name: govulncheck
        run: make vuln

      - name: gosec
        run: gosec -quiet -exclude-generated ./...

      - name: Fuzz parsers (short)
        run: make fuzz FUZZTIME=15s

  images:
    name: Container images (build and health-check)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout machinarchy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: machinarchy
          persist-credentials: false

      - name: Checkout machinarchy-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/machinarchy-agent
          ref: ${{ env.AGENT_REF }}
          path: machinarchy-agent
          token: ${{ secrets.AGENT_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Build machinarchy images
        working-directory: machinarchy
        run: make images IMAGE_TAG=ci AGENT_SOURCE=../machinarchy-agent

      - name: Build the agent image
        working-directory: machinarchy-agent
        run: |
          docker buildx build --load --build-arg VERSION=ci \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_TIME="$(git log -1 --format=%cI)" \
            -t machinarchy-agent:ci .

      - name: Monolith image turns healthy and stops cleanly
        run: |
          set -euo pipefail
          docker run -d --name monolith \
            -e MACHINARCHY_ENVIRONMENT=development \
            -e MACHINARCHY_OPERATOR_TOKEN="$(openssl rand -hex 24)" \
            -e MACHINARCHY_ENCRYPTION_SECRET="$(openssl rand -hex 24)" \
            machinarchy-monolith:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' monolith)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect --format 'health={{.State.Health.Status}} user={{.Config.User}}' monolith
          [ "$(docker inspect --format '{{.State.Health.Status}}' monolith)" = healthy ]
          docker stop --time 30 monolith
          [ "$(docker inspect --format '{{.State.ExitCode}}' monolith)" = 0 ]

      - name: CLI and agent images report their versions
        run: |
          docker run --rm machinarchy-cli:ci version
          docker run --rm machinarchy-agent:ci --version

  orchestrate-release:
    name: Evaluate and create semantic release
    if: ${{ github.event_name == 'push' && contains(fromJSON('["refs/heads/main","refs/heads/beta","refs/heads/alpha"]'), github.ref) }}
    needs: [verify, security, images]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
    secrets:
      # A PAT or GitHub App token, not GITHUB_TOKEN, so Release Please's
      # PR/tag events can trigger downstream workflows.
      MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}

  docker-production-delivery:
    name: Publish, scan, and sign ${{ matrix.command }} image
    needs: orchestrate-release
    if: >-
      ${{
        needs.orchestrate-release.result == 'success' &&
        needs.orchestrate-release.outputs.new_release_published == 'true'
      }}
    strategy:
      matrix:
        command: [api, controlmanager, monolith]
    uses: ./.github/workflows/template-docker.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      image_name: machinarchy-${{ matrix.command }}
      machinarchy_command: ${{ matrix.command }}
      version: ${{ needs.orchestrate-release.outputs.new_release_version }}
      registry: ghcr.io
      organization: ${{ github.repository_owner }}
      docker_push: true
    secrets:
      AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
