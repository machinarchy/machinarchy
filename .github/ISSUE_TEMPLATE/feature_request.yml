name: Feature Request
description: Suggest an idea, command primitive, or protocol improvement.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what is difficult or missing in your current fleet management workflow.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What new command, agent capability, or UI wrapper would solve this?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How are you solving this right now? (e.g., writing custom bash wrapper loops over SSH)
