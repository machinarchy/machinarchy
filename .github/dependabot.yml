version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "23:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "23:15"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "23:30"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5

  # Compose files pin images by digest (deployments/infra.docker-compose.yml).
  - package-ecosystem: docker-compose
    directory: "/deployments"
    schedule:
      interval: weekly
      day: sunday
      time: "23:45"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3
