version: '3.8'

networks:
  testing-net:
    driver: bridge
    name: app-testing-network

services:
  # SERVER 1: Strictly Password Authentication
  ssh-password:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: test-ssh-password
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=testuser
      - USER_PASSWORD=SecretPassword123
    volumes:
      - ./data/.ssh/sshd_password_only:/etc/ssh/sshd_config:ro
    ports:
      - "2221:2222"
    networks:
      - testing-net
    restart: unless-stopped

  # SERVER 2: Strictly Private Key Authentication
  ssh-key:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: test-ssh-key
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=testuser
    volumes:
      - ./data/.ssh/sshd_key_only:/etc/ssh/sshd_config:ro
      # Standard LinuxServer pattern: public keys mapped to authorized_keys
      - ./data/.ssh/test_id_ed25519.pub:/config/.ssh/authorized_keys:ro
    ports:
      - "2222:2222"
    networks:
      - testing-net
    restart: unless-stopped

  # SERVER 3: Host Key & Fingerprint Verification Testing
  # This server guarantees the host keys stay identical between container rebuilds,
  # allowing you to test strict known_hosts pipelines without throwing key mismatch exceptions.
  ssh-hostcheck:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: test-ssh-hostcheck
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=testuser
      - USER_PASSWORD=HostCheckPassword789
    volumes:
      - ./data/.ssh/sshd_password_only:/etc/ssh/sshd_config:ro
      # Persist the actual machine signatures inside your gitignored folder
      - ./data/.ssh/host_keys:/etc/ssh/ssh_host_keys
    ports:
      - "2223:2222"
    networks:
      - testing-net
    restart: unless-stopped
