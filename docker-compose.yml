name: machinarchy-apps

services:
  monolit:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      # The agent wire contract comes from the sibling machinarchy-agent checkout.
      additional_contexts:
        agent-protocol: ${MACHINARCHY_AGENT_SOURCE:-../machinarchy-agent}/protocol
      args:
        MACHINARCHY_COMMAND: monolit
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Local stack only: plain HTTP and a non-TLS PostgreSQL connection.
      MACHINARCHY_ENVIRONMENT: development
      MACHINARCHY_LISTEN_ADDR: ":8080"
      MACHINARCHY_DATABASE_ENGINE: postgres
      MACHINARCHY_DATABASE_URL: postgres://machinarchy:${POSTGRES_PASSWORD:-machinarchy_dev_only}@postgres:5432/machinarchy_dev?sslmode=disable
    restart: unless-stopped
    # Must exceed MACHINARCHY_SHUTDOWN_TIMEOUT (default 25s); Docker's 10s
    # default would SIGKILL the process mid-drain.
    stop_grace_period: 30s
    networks:
      - machinarchy-network

networks:
  machinarchy-network:
    name: machinarchy-network
    external: true