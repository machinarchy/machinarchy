# Machinarchy local SSH integration-test fixtures.
# Run via Makefile targets, not the root application Compose file.
# Bind-mounted config directories persist each server's SSH host keys.

services:
  # Password authentication only. Public-key authentication is disabled by
  # the mounted sshd_config.d snippet generated by setup-ssh-servers.sh.
  ssh-password:
    image: ${SSH_SERVER_IMAGE:-lscr.io/linuxserver/openssh-server:latest}
    hostname: machinarchy-ssh-password
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      USER_NAME: "${SSH_TEST_USER:-testuser}"
      PASSWORD_ACCESS: "true"
      USER_PASSWORD_FILE: /run/secrets/machinarchy_ssh_test_password
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    volumes:
      - type: bind
        source: ../../data/.ssh/config/password
        target: /config
      - type: bind
        source: ../../data/.ssh/${SSH_TEST_USER:-testuser}.password
        target: /run/secrets/machinarchy_ssh_test_password
        read_only: true
    ports:
      - "127.0.0.1:${SSH_PASSWORD_HOST_PORT:-2221}:2222"
    networks:
      - testing-net
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 2222"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Public-key authentication only. LinuxServer's PUBLIC_KEY_FILE bootstrap
  # imports the generated client public key into /config/.ssh/authorized_keys.
  ssh-key:
    image: ${SSH_SERVER_IMAGE:-lscr.io/linuxserver/openssh-server:latest}
    hostname: machinarchy-ssh-key
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      USER_NAME: "${SSH_TEST_USER:-testuser}"
      PASSWORD_ACCESS: "false"
      PUBLIC_KEY_FILE: /run/secrets/machinarchy_test_ed25519.pub
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    volumes:
      - type: bind
        source: ../../data/.ssh/config/key
        target: /config
      - type: bind
        source: ../../data/.ssh/test_id_ed25519.pub
        target: /run/secrets/machinarchy_test_ed25519.pub
        read_only: true
    ports:
      - "127.0.0.1:${SSH_KEY_HOST_PORT:-2222}:2222"
    networks:
      - testing-net
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 2222"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Password authentication with a separately persisted /config directory.
  # The image creates /config/ssh_host_keys on first start; keeping /config
  # bind-mounted preserves those host keys across container recreation.
  ssh-hostcheck:
    image: ${SSH_SERVER_IMAGE:-lscr.io/linuxserver/openssh-server:latest}
    hostname: machinarchy-ssh-hostcheck
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      USER_NAME: "${SSH_TEST_USER:-testuser}"
      PASSWORD_ACCESS: "true"
      USER_PASSWORD_FILE: /run/secrets/machinarchy_ssh_test_password
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    volumes:
      - type: bind
        source: ../../data/.ssh/config/hostcheck
        target: /config
      - type: bind
        source: ../../data/.ssh/${SSH_TEST_USER:-testuser}.password
        target: /run/secrets/machinarchy_ssh_test_password
        read_only: true
    ports:
      - "127.0.0.1:${SSH_HOSTCHECK_HOST_PORT:-2223}:2222"
    networks:
      - testing-net
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 2222"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  testing-net:
    driver: bridge
