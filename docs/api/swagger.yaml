basePath: /
definitions:
  agents.createTokenRequest:
    properties:
      hostname:
        description: Hostname, when set, is the only hostname this token enrols.
        type: string
      ttlSeconds:
        description: TTLSeconds defaults to 3600; 60 to 86400.
        type: integer
    type: object
  agents.createTokenResponse:
    properties:
      createdAt:
        type: string
      createdBy:
        type: integer
      expiresAt:
        type: string
      hostname:
        type: string
      id:
        type: string
      revokedAt:
        type: string
      token:
        description: Token is the secret, shown only in this response.
        type: string
      usedAt:
        type: string
      usedByAgent:
        type: string
    type: object
  agents.invokeRequest:
    properties:
      capability:
        type: string
      input:
        type: object
      timeoutSeconds:
        type: integer
    type: object
  agents.tokenList:
    properties:
      items:
        items:
          $ref: '#/definitions/agents.tokenView'
        type: array
    type: object
  agents.tokenView:
    properties:
      createdAt:
        type: string
      createdBy:
        type: integer
      expiresAt:
        type: string
      hostname:
        type: string
      id:
        type: string
      revokedAt:
        type: string
      usedAt:
        type: string
      usedByAgent:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: operator@example.com
        type: string
      password:
        example: account-password
        type: string
      username:
        example: operator
        type: string
    required:
    - password
    type: object
  auth.MessageResponse:
    properties:
      message:
        type: string
    type: object
  auth.SignUpRequest:
    properties:
      email:
        example: operator@example.com
        type: string
      password:
        example: use-a-secret-with-12+-bytes
        type: string
      username:
        example: operator
        type: string
    required:
    - password
    - username
    type: object
  domain.APIToken:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: integer
      name:
        type: string
      revokedAt:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
    type: object
  domain.AuditEvent:
    properties:
      action:
        type: string
      actorTokenId:
        type: integer
      actorUserId:
        type: integer
      actorUsername:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      hash:
        type: string
      id:
        type: integer
      occurredAt:
        type: string
      outcome:
        type: string
      prevHash:
        type: string
      requestId:
        type: string
      source:
        type: string
      targetId:
        type: string
      targetType:
        type: string
    type: object
  domain.AuditVerification:
    properties:
      events:
        type: integer
      firstInvalidId:
        type: integer
      headHash:
        description: |-
          HeadHash is the hash of the newest event. Record it somewhere outside the
          database (a ticket, a log line) to detect later truncation of the tail.
        type: string
      reason:
        type: string
      valid:
        type: boolean
    type: object
  domain.AuthTokenResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.UserResponse'
    type: object
  domain.Environment:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  domain.IssuedAPIToken:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: integer
      name:
        type: string
      revokedAt:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
      token:
        type: string
    type: object
  domain.Role:
    enum:
    - owner
    - operator
    - reader
    type: string
    x-enum-varnames:
    - RoleOwner
    - RoleOperator
    - RoleReader
  domain.TargetRule:
    properties:
      all:
        type: boolean
      exclude:
        items:
          type: string
        type: array
      include:
        items:
          type: string
        type: array
      selector:
        type: string
    type: object
  domain.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  domain.WorkspaceMember:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/domain.Role'
        enum:
        - owner
        - operator
        - reader
      username:
        type: string
    type: object
  environments.EnvSavePayload:
    properties:
      description:
        example: Primary cluster management environment
        type: string
      name:
        example: production
        type: string
    required:
    - name
    type: object
  httperr.Body:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  managedresource.hostRequest:
    properties:
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      spec:
        $ref: '#/definitions/resource.HostSpec'
    type: object
  managedresource.hostUpdateRequest:
    properties:
      generation:
        type: integer
      revision:
        type: integer
      spec:
        $ref: '#/definitions/resource.HostSpec'
    type: object
  managedresource.labelsRequest:
    properties:
      labels:
        additionalProperties:
          type: string
        type: object
      revision:
        type: integer
    type: object
  managedresource.operationRequest:
    properties:
      expectTargetsHash:
        type: string
      hostIds:
        items:
          type: string
        type: array
      run:
        $ref: '#/definitions/resource.RunSpec'
      targets:
        $ref: '#/definitions/domain.TargetRule'
    type: object
  managedresource.previewRequest:
    properties:
      targets:
        $ref: '#/definitions/domain.TargetRule'
    type: object
  managedresource.profileRequest:
    properties:
      description:
        type: string
      name:
        type: string
      spec:
        $ref: '#/definitions/resource.AccessProfileSpec'
    type: object
  managedresource.profileUpdateRequest:
    properties:
      expectedRevision:
        type: integer
      spec:
        $ref: '#/definitions/resource.AccessProfileSpec'
    type: object
  managedresource.trustRequest:
    properties:
      fingerprints:
        description: |-
          Fingerprints are the exact SHA256:… fingerprints to trust, normally the
          Host's status.observedHostKeys as reviewed.
        items:
          type: string
        type: array
      generation:
        description: Generation is the Host spec generation the caller reviewed.
        type: integer
      replace:
        description: Replace must be set to change keys the Host already trusts.
        type: boolean
    type: object
  members.SetRoleRequest:
    properties:
      role:
        enum:
        - owner
        - operator
        - reader
        example: operator
        type: string
    type: object
  resource.AccessProfile:
    properties:
      createdAt:
        type: string
      createdBy:
        type: integer
      currentRevision:
        type: integer
      deletedAt:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
      workspaceId:
        type: integer
    type: object
  resource.AccessProfileRevision:
    properties:
      checksum:
        type: string
      createdAt:
        type: string
      createdBy:
        type: integer
      profileId:
        type: string
      revision:
        type: integer
      spec:
        $ref: '#/definitions/resource.AccessProfileSpec'
      workspaceId:
        type: integer
    type: object
  resource.AccessProfileSpec:
    properties:
      authenticationMethod:
        $ref: '#/definitions/resource.AuthenticationMethod'
      connectorKind:
        $ref: '#/definitions/resource.ConnectorKind'
      credential:
        $ref: '#/definitions/resource.SecretReference'
      enabled:
        type: boolean
      execution:
        allOf:
        - $ref: '#/definitions/resource.ExecutionSettings'
        description: Execution configures detached runs on the profile's hosts.
      hostCertificateAuthorities:
        items:
          type: string
        type: array
      hostKeyPolicy:
        allOf:
        - $ref: '#/definitions/resource.HostKeyPolicy'
        description: |-
          HostKeyPolicy and HostCertificateAuthorities decide how the hosts that
          use this profile become trusted (see hostkeys.go).
      username:
        type: string
    type: object
  resource.ActorRef:
    properties:
      apiTokenId:
        type: integer
      userId:
        type: integer
    type: object
  resource.AuthenticationMethod:
    enum:
    - password
    - private-key
    type: string
    x-enum-varnames:
    - AuthenticationPassword
    - AuthenticationPrivateKey
  resource.Condition:
    properties:
      lastTransitionTime:
        type: string
      message:
        type: string
      observedGeneration:
        type: integer
      reason:
        type: string
      status:
        $ref: '#/definitions/resource.ConditionStatus'
      type:
        type: string
    type: object
  resource.ConditionStatus:
    enum:
    - "True"
    - "False"
    - Unknown
    type: string
    x-enum-varnames:
    - ConditionTrue
    - ConditionFalse
    - ConditionUnknown
  resource.ConnectorKind:
    enum:
    - ssh
    type: string
    x-enum-varnames:
    - ConnectorSSH
  resource.DesiredPresence:
    enum:
    - Managed
    - Absent
    type: string
    x-enum-varnames:
    - PresenceManaged
    - PresenceAbsent
  resource.ExecutionSettings:
    properties:
      maxOutputFileBytes:
        description: |-
          MaxOutputFileBytes caps each output file on the host (ulimit -f);
          0 means 100 MiB.
        type: integer
      stateRoot:
        description: |-
          StateRoot holds per-target directories on the host; the default is
          $HOME/.local/state/machinarchy of the login user.
        type: string
      supervisor:
        allOf:
        - $ref: '#/definitions/resource.ExecutionSupervisor'
        description: |-
          Supervisor: auto (default; systemd-run when usable, else setsid),
          systemd, setsid, or attached (detached runs are refused).
    type: object
  resource.ExecutionSupervisor:
    enum:
    - auto
    - systemd
    - setsid
    - attached
    type: string
    x-enum-comments:
      SupervisorAttached: no detached runs
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - no detached runs
    x-enum-varnames:
    - SupervisorAuto
    - SupervisorSystemd
    - SupervisorSetsid
    - SupervisorAttached
  resource.Host:
    properties:
      metadata:
        $ref: '#/definitions/resource.HostMetadata'
      spec:
        $ref: '#/definitions/resource.HostSpec'
      status:
        $ref: '#/definitions/resource.HostStatus'
    type: object
  resource.HostAccessTarget:
    properties:
      endpoint:
        type: string
      trust:
        items:
          type: string
        type: array
    type: object
  resource.HostKeyPolicy:
    enum:
    - ""
    - tofu
    - approve
    - ca
    - pinned
    type: string
    x-enum-varnames:
    - HostKeyPolicyDefault
    - HostKeyPolicyTOFU
    - HostKeyPolicyApprove
    - HostKeyPolicyCA
    - HostKeyPolicyPinned
  resource.HostMetadata:
    properties:
      createdAt:
        type: string
      deletionTimestamp:
        type: string
      environmentId:
        type: integer
      generation:
        type: integer
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      revision:
        type: integer
      updatedAt:
        type: string
      workspaceId:
        type: integer
    type: object
  resource.HostPhase:
    enum:
    - Pending
    - Active
    - Deleting
    type: string
    x-enum-varnames:
    - HostPending
    - HostActive
    - HostDeleting
  resource.HostSpec:
    properties:
      accessProfileId:
        type: string
      accessTarget:
        allOf:
        - $ref: '#/definitions/resource.HostAccessTarget'
        description: |-
          AccessTarget is host-owned connector-neutral location and trust material.
          Its interpretation is restricted to the selected connector adapter.
      presence:
        $ref: '#/definitions/resource.DesiredPresence'
      profileRevision:
        type: integer
    type: object
  resource.HostStatus:
    properties:
      conditions:
        items:
          $ref: '#/definitions/resource.Condition'
        type: array
      lastObservedAt:
        type: string
      observedGeneration:
        type: integer
      observedHostKeys:
        description: |-
          ObservedHostKeys are the SSH host keys last seen on the network, kept
          so an owner can approve them (or see what changed).
        items:
          $ref: '#/definitions/resource.ObservedHostKey'
        type: array
      phase:
        $ref: '#/definitions/resource.HostPhase'
    type: object
  resource.HostTargetSet:
    properties:
      excluded:
        items:
          $ref: '#/definitions/resource.Host'
        type: array
      hosts:
        items:
          $ref: '#/definitions/resource.Host'
        type: array
      targetsHash:
        description: |-
          TargetsHash identifies the exact Host IDs and generations matched, so a
          submission can require that it runs on what was reviewed.
        type: string
      unknownExcludes:
        items:
          type: string
        type: array
      unknownIncludes:
        items:
          type: string
        type: array
    type: object
  resource.LaunchHandle:
    properties:
      attempt:
        description: |-
          Attempt counts launches of this target (1 for the first). A launch
          proven never to have started is retried up to MaxLaunchAttempts.
        type: integer
      deadline:
        description: |-
          Deadline is when the command must have finished: launch time plus
          the run's timeout, or the Operation deadline if earlier.
        type: string
      endpoint:
        description: |-
          Endpoint is the Host endpoint at launch; a poll of a moved Host is
          treated as unreachable rather than sent to another machine.
        type: string
      launchedAt:
        type: string
      mode:
        description: |-
          Mode is systemd or setsid; empty means the launch reply never arrived
          (the connection failed mid-launch), so the poller must find out
          whether the command started.
        type: string
      pid:
        type: integer
      root:
        description: Root is the state root used at launch ("" = the default).
        type: string
      unit:
        type: string
    type: object
  resource.ObservedHostKey:
    properties:
      algorithm:
        type: string
      fingerprint:
        type: string
      firstSeenAt:
        type: string
      lastSeenAt:
        description: |-
          LastSeenAt is when a scan last saw the key. The reconciler reuses a
          recent scan instead of connecting again (see HostReconciler).
        type: string
    type: object
  resource.Operation:
    properties:
      createdAt:
        type: string
      createdBy:
        $ref: '#/definitions/resource.ActorRef'
      finishedAt:
        type: string
      id:
        type: string
      kind:
        $ref: '#/definitions/resource.OperationKind'
      revision:
        type: integer
      spec:
        $ref: '#/definitions/resource.OperationSpec'
      startedAt:
        type: string
      status:
        $ref: '#/definitions/resource.OperationStatus'
      workspaceId:
        type: integer
    type: object
  resource.OperationKind:
    enum:
    - Run
    type: string
    x-enum-varnames:
    - OperationKindRun
  resource.OperationSpec:
    properties:
      deadline:
        type: string
      run:
        $ref: '#/definitions/resource.RunSpec'
      targets:
        items:
          $ref: '#/definitions/resource.OperationTargetSpec'
        type: array
    type: object
  resource.OperationState:
    enum:
    - Queued
    - Running
    - CancelRequested
    - Succeeded
    - PartiallySucceeded
    - Failed
    - Cancelled
    - TimedOut
    - Interrupted
    type: string
    x-enum-varnames:
    - OperationQueued
    - OperationRunning
    - OperationCancelRequested
    - OperationSucceeded
    - OperationPartiallySucceeded
    - OperationFailed
    - OperationCancelled
    - OperationTimedOut
    - OperationInterrupted
  resource.OperationStatus:
    properties:
      cancelAsked:
        type: boolean
      conditions:
        items:
          $ref: '#/definitions/resource.Condition'
        type: array
      state:
        $ref: '#/definitions/resource.OperationState'
      targets:
        items:
          $ref: '#/definitions/resource.OperationTarget'
        type: array
    type: object
  resource.OperationSummary:
    properties:
      cancelRequested:
        type: boolean
      createdAt:
        type: string
      createdBy:
        $ref: '#/definitions/resource.ActorRef'
      finishedAt:
        type: string
      id:
        type: string
      kind:
        $ref: '#/definitions/resource.OperationKind'
      startedAt:
        type: string
      state:
        $ref: '#/definitions/resource.OperationState'
      targets:
        additionalProperties:
          type: integer
        type: object
    type: object
  resource.OperationTarget:
    properties:
      launch:
        allOf:
        - $ref: '#/definitions/resource.LaunchHandle'
        description: |-
          Launch and Live are set for detached runs: how to reach the command,
          and its captured output (kept after it ends, so output can be read by
          byte offset). Live is stored encrypted on its own and never serialized
          with the target; the output endpoint serves it to callers allowed to
          see output.
      progress:
        allOf:
        - $ref: '#/definitions/resource.TargetProgressSummary'
        description: 'Progress summarizes Live for API readers: sizes and timing,
          no output.'
      result:
        $ref: '#/definitions/resource.TargetResult'
      spec:
        $ref: '#/definitions/resource.OperationTargetSpec'
      state:
        $ref: '#/definitions/resource.TargetState'
    type: object
  resource.OperationTargetSpec:
    properties:
      accessProfileId:
        type: string
      accessProfileRevision:
        type: integer
      displayName:
        type: string
      hostGeneration:
        type: integer
      hostId:
        type: string
    type: object
  resource.OutputStream:
    enum:
    - stdout
    - stderr
    type: string
    x-enum-varnames:
    - StreamStdout
    - StreamStderr
  resource.Page-resource_AccessProfile:
    properties:
      items:
        items:
          $ref: '#/definitions/resource.AccessProfile'
        type: array
      nextCursor:
        type: string
    type: object
  resource.Page-resource_Host:
    properties:
      items:
        items:
          $ref: '#/definitions/resource.Host'
        type: array
      nextCursor:
        type: string
    type: object
  resource.Page-resource_OperationSummary:
    properties:
      items:
        items:
          $ref: '#/definitions/resource.OperationSummary'
        type: array
      nextCursor:
        type: string
    type: object
  resource.RunSpec:
    properties:
      argv:
        items:
          type: string
        type: array
      concurrency:
        type: integer
      detach:
        description: |-
          Detach runs the command under a supervisor on each host and ends the
          SSH session right after the launch (AUDIT/10b §1). The timeout may
          then be up to MaxDetachedTimeoutSeconds; attached runs keep
          MaxAttachedTimeoutSeconds.
        type: boolean
      timeoutSeconds:
        type: integer
    type: object
  resource.SecretReference:
    properties:
      id:
        type: string
      version:
        type: integer
    type: object
  resource.TargetOutput:
    properties:
      bytes:
        description: Bytes is the stream's full size; Truncated means part of it is
          gone.
        type: integer
      from:
        description: |-
          From and Next are stream byte offsets: Text covers the stream from
          From on, and the next request should ask for Next. A detached target
          keeps its first and last 15 KiB; a part of the stream that was not
          kept appears in Text as one "[… N bytes omitted …]" line.
        type: integer
      hostId:
        type: string
      live:
        description: |-
          Live is true until the target is final (pending or running): more
          output can follow, so a follower keeps asking.
        type: boolean
      next:
        type: integer
      operationId:
        type: string
      state:
        $ref: '#/definitions/resource.TargetState'
      stream:
        $ref: '#/definitions/resource.OutputStream'
      text:
        type: string
      truncated:
        type: boolean
    type: object
  resource.TargetProgressSummary:
    properties:
      cancelReason:
        type: string
      cancelSentAt:
        type: string
      lastContactAt:
        type: string
      polls:
        type: integer
      stderrBytes:
        type: integer
      stdoutBytes:
        type: integer
    type: object
  resource.TargetResult:
    properties:
      errorClass:
        type: string
      exitCode:
        type: integer
      output:
        type: string
      stderr:
        type: string
      stderrBytes:
        type: integer
      stdout:
        type: string
      stdoutBytes:
        description: |-
          StdoutBytes and StderrBytes are the streams' full sizes on the host;
          Truncated means the stored text omits part of them (detached runs keep
          a head and a tail of each stream).
        type: integer
      truncated:
        type: boolean
    type: object
  resource.TargetState:
    enum:
    - Pending
    - Running
    - Succeeded
    - Failed
    - TimedOut
    - Cancelled
    - Interrupted
    - Lost
    type: string
    x-enum-varnames:
    - TargetPending
    - TargetRunning
    - TargetSucceeded
    - TargetFailed
    - TargetTimedOut
    - TargetCancelled
    - TargetInterrupted
    - TargetLost
  service.AccessProfileView:
    properties:
      createdAt:
        type: string
      createdBy:
        type: integer
      currentRevision:
        type: integer
      deletedAt:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      spec:
        $ref: '#/definitions/resource.AccessProfileSpec'
      updatedAt:
        type: string
      workspaceId:
        type: integer
    type: object
  tokens.CreateRequest:
    properties:
      expiresInHours:
        example: 720
        type: integer
      name:
        example: ci-deploy
        type: string
      role:
        enum:
        - operator
        - reader
        example: reader
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for managing Machinarchy environments, SSH hosts, and operations.
  termsOfService: https://github.com/machinarchy/machinarchy
  title: Machinarchy API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an account, returns a JWT, and sets the auth_token
        cookie.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.Body'
      summary: Log in
      tags:
      - Authentication
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
      summary: Log out
      tags:
      - Authentication
  /api/auth/signup:
    post:
      consumes:
      - application/json
      description: Creates an account, returns a JWT, and sets the auth_token cookie.
      parameters:
      - description: Account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperr.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httperr.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.Body'
      summary: Create an account
      tags:
      - Authentication
  /api/v1/agents:
    get:
      produces:
      - application/json
      responses:
