      - application/json
      description: |-
        200 means the agent answered. The body is the agent's signed result: check its `status`.
        `succeeded` carries `output`. `rejected` (with `code`, for example `capability_unavailable`)
        and `failed` are the agent's own answers and also return 200.
        HTTP errors mean there was no answer: 503 when this process runs no gateway or the agent has no live lease,
        504 when the agent did not answer within `timeoutSeconds` (default 15, at most 20).
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Capability call
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agents.invokeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The agent's result; see status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperr.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.Body'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httperr.Body'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/httperr.Body'
