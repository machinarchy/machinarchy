  /api/v1/members/{id}/role:
    put:
      consumes:
      - application/json
      description: Requires a human workspace owner session. Takes effect on the member's
        next request, including for API tokens, whose effective role never exceeds
        the membership role. A workspace must always keep at least one owner. The
        change is recorded in the structured server log.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/members.SetRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.WorkspaceMember'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change a member's role
      tags:
      - Members
  /api/v1/runs:
    get:
      description: Newest first, without arguments or per-host results. Requires operations
        read permission.
      parameters:
      - description: Only runs with this status
        in: query
        name: status
        type: string
      - description: Only runs with a smaller id (paging cursor)
        in: query
        name: before_id
        type: integer
      - description: Page size (default 50, maximum 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Run'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List runs
      tags:
      - Runs
    post:
      consumes:
      - application/json
      description: 'Disabled unless the server enables execution and lists the allowed
        programs. Requires the runs:execute permission (owners and operators). The
        command is an argument list with no shell, the targets are resolved and pinned
        when the run is accepted, and the run executes in the background: poll GET
        /api/v1/runs/{id}. Output is combined stdout and stderr. Commands are never
        retried; a timeout or cancellation does not prove the command did not run.
        The 202 response carries the run; with dryRun the plan is returned with 200
        and nothing is stored or contacted.'
      parameters:
      - description: Command and target rule
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/runs.SubmitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Dry run plan
          schema:
            $ref: '#/definitions/domain.Run'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/domain.Run'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: The targeted hosts changed since the preview
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Run a command on hosts
      tags:
      - Runs
  /api/v1/runs/{id}:
    get:
      description: Callers with the runs:execute permission also see the arguments
        and each host's output; others see only status, exit codes, and errors.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Run'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a run
      tags:
      - Runs
  /api/v1/runs/{id}/cancel:
    post:
      description: Stops new hosts from starting and closes running SSH sessions.
        A command that was already sent may still have run, or keep running, on its
        host; cancelled hosts are reported as such. Requires the runs:execute permission.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/domain.Run'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel a run
      tags:
      - Runs
  /api/v1/tokens:
    get:
      description: Requires a human workspace owner session. Returns metadata for
        tokens created by the current user; plaintext secrets are never returned.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.APIToken'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API tokens
      tags:
      - API tokens
    post:
      consumes:
      - application/json
      description: Requires a human workspace owner session. Tokens are limited to
        operator or reader and their effective access cannot exceed the owner's current
        workspace membership role. Plaintext is returned only in this response.
      parameters:
      - description: Token name, role, and lifetime
        in: body
        name: request
        required: true
