basePath: /
definitions:
  auth.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: operator@example.com
        type: string
      password:
        example: account-password
        type: string
      username:
        example: operator
        type: string
    required:
    - password
    type: object
  auth.MessageResponse:
    properties:
      message:
        type: string
    type: object
  auth.SignUpRequest:
    properties:
      email:
        example: operator@example.com
        type: string
      password:
        example: use-a-secret-with-12+-bytes
        type: string
      username:
        example: operator
        type: string
    required:
    - password
    - username
    type: object
  domain.APIToken:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: integer
      name:
        type: string
      revokedAt:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
    type: object
  domain.AuditEvent:
    properties:
      action:
        type: string
      actorTokenId:
        type: integer
      actorUserId:
        type: integer
      actorUsername:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      hash:
        type: string
      id:
        type: integer
      occurredAt:
        type: string
      outcome:
        type: string
      prevHash:
        type: string
      requestId:
        type: string
      source:
        type: string
      targetId:
        type: string
      targetType:
        type: string
    type: object
  domain.AuditVerification:
    properties:
      events:
        type: integer
      firstInvalidId:
        type: integer
      headHash:
        description: |-
          HeadHash is the hash of the newest event. Record it somewhere outside the
          database (a ticket, a log line) to detect later truncation of the tail.
        type: string
      reason:
        type: string
      valid:
        type: boolean
    type: object
  domain.AuthTokenResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.UserResponse'
    type: object
  domain.BulkImportResponse:
    properties:
      duplicate_count:
        type: integer
      failure_count:
        type: integer
      results:
        items:
          $ref: '#/definitions/domain.HostOperationResult'
        type: array
      success_count:
        type: integer
      total_processed:
        type: integer
      valid_count:
        type: integer
      validate_only:
        type: boolean
    type: object
  domain.ConnectionMethod:
    enum:
    - SSH
    - AGENT_PULL
    - AGENT_PUSH
    type: string
    x-enum-varnames:
    - MethodSSH
    - MethodAgentPull
    - MethodAgentPush
  domain.DataPoint:
    properties:
      cpuPercent:
        type: number
      created_at:
        type: string
      memPercent:
        type: number
      timestamp:
        type: string
    type: object
  domain.Environment:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  domain.Host:
    properties:
      connection:
        $ref: '#/definitions/domain.ConnectionMethod'
      created_at:
        type: string
      environmentId:
        type: integer
      hostname:
        type: string
      id:
        type: string
      ip_address:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      ssh:
        $ref: '#/definitions/domain.SSHAccess'
      updated_at:
        type: string
    type: object
  domain.HostOperationResult:
    properties:
      address:
        type: string
      error:
        type: string
      hostname:
        type: string
      id:
        type: string
      index:
        type: integer
      name:
        type: string
      status:
        $ref: '#/definitions/domain.HostResultStatus'
    type: object
  domain.HostResultStatus:
    enum:
    - success
    - valid
    - failed
    - duplicate
    type: string
    x-enum-varnames:
    - StatusSuccess
    - StatusValid
    - StatusFailed
    - StatusDuplicate
  domain.HostStatus:
    enum:
    - PENDING
    - ACTIVE
    - SUBJUGATED
    - DISCONNECTED
    type: string
    x-enum-varnames:
    - HostStatusPending
    - HostStatusActive
    - HostStatusSubjugated
    - HostStatusDisconnected
  domain.IssuedAPIToken:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: integer
      name:
        type: string
      revokedAt:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
      token:
        type: string
    type: object
  domain.Job:
    properties:
      command:
        type: string
      finishedAt:
        type: string
      hostId:
        type: integer
      id:
        type: integer
      resultLog:
        type: string
      startedAt:
        type: string
      status:
        $ref: '#/definitions/domain.JobStatus'
      triggeredBy:
        type: string
    type: object
  domain.JobStatus:
    enum:
    - PENDING
    - RUNNING
    - COMPLETED
    - FAILED
    type: string
    x-enum-varnames:
    - JobStatusPending
    - JobStatusRunning
    - JobStatusCompleted
    - JobStatusFailed
  domain.Role:
    enum:
    - owner
    - operator
    - reader
    type: string
    x-enum-varnames:
    - RoleOwner
    - RoleOperator
    - RoleReader
  domain.Run:
    properties:
      argCount:
        type: integer
      argv:
        description: |-
          Argv is only returned to callers allowed to execute; it may contain
          sensitive values and is stored encrypted.
        items:
          type: string
        type: array
      cancelRequested:
        description: CancelRequested is set when cancellation was asked for.
        type: boolean
      concurrency:
        type: integer
      counts:
        $ref: '#/definitions/domain.RunCounts'
      createdAt:
        type: string
      createdByTokenId:
        type: integer
      createdByUserId:
        type: integer
      createdByUsername:
        type: string
      finishedAt:
        type: string
      hosts:
        description: |-
          Hosts is omitted from listings. Output is only included for callers
          allowed to execute.
        items:
          $ref: '#/definitions/domain.RunHost'
        type: array
      id:
        type: integer
      program:
        type: string
      rule:
        $ref: '#/definitions/domain.TargetRule'
      startedAt:
        type: string
      status:
        $ref: '#/definitions/domain.RunStatus'
      targetsHash:
        type: string
      timeoutSeconds:
        type: integer
    type: object
  domain.RunCounts:
    properties:
      cancelled:
        type: integer
      failed:
        type: integer
      interrupted:
        type: integer
      pending:
        type: integer
      running:
        type: integer
      succeeded:
        type: integer
      timedOut:
        type: integer
    type: object
  domain.RunHost:
    properties:
      address:
        type: string
      error:
        type: string
      exitCode:
        type: integer
      finishedAt:
        type: string
      hostId:
        type: string
      name:
        type: string
      output:
        type: string
      port:
        type: integer
      startedAt:
        type: string
      status:
        $ref: '#/definitions/domain.RunHostStatus'
    type: object
  domain.RunHostStatus:
    enum:
    - pending
    - running
    - succeeded
    - failed
    - timed_out
    - cancelled
    - interrupted
    type: string
    x-enum-varnames:
    - RunHostPending
    - RunHostRunning
    - RunHostSucceeded
    - RunHostFailed
    - RunHostTimedOut
    - RunHostCancelled
    - RunHostInterrupted
  domain.RunStatus:
    enum:
    - queued
    - running
    - succeeded
    - partially_succeeded
    - failed
    - cancelled
    - interrupted
    - planned
    type: string
    x-enum-varnames:
    - RunQueued
    - RunRunning
    - RunSucceeded
    - RunPartiallySucceeded
    - RunFailed
    - RunCancelled
    - RunInterrupted
    - RunPlanned
  domain.SSHAccess:
    properties:
      last_check_at:
        type: string
      last_check_duration_ms:
        type: integer
      last_check_message:
        type: string
      port:
        type: integer
      status:
        $ref: '#/definitions/domain.HostStatus'
      username:
        type: string
    type: object
  domain.TargetHost:
    properties:
      address:
        type: string
      environment:
        type: string
      hostname:
        type: string
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      status:
        $ref: '#/definitions/domain.HostStatus'
    type: object
  domain.TargetPreview:
    properties:
      excluded:
        description: Excluded lists hosts that were selected but removed by the exclude
          list.
        items:
          $ref: '#/definitions/domain.TargetHost'
        type: array
      hosts:
        items:
          $ref: '#/definitions/domain.TargetHost'
        type: array
      targetsHash:
        description: |-
          TargetsHash identifies the exact targeted hosts (all of them, not only the
          listed ones). A run can require it so it runs on what was reviewed.
        type: string
      total:
        description: Total is the number of targeted hosts; Hosts lists at most MaxPreviewHosts
          of them.
        type: integer
      truncated:
        type: boolean
      unknownExcludes:
        items:
          type: string
        type: array
      unknownIncludes:
        items:
          type: string
        type: array
    type: object
  domain.TargetRule:
    properties:
      all:
        type: boolean
      exclude:
        items:
          type: string
        type: array
      include:
        items:
          type: string
        type: array
      selector:
        type: string
    type: object
  domain.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  domain.WorkspaceMember:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/domain.Role'
        enum:
        - owner
        - operator
        - reader
      username:
        type: string
    type: object
  environments.EnvSavePayload:
    properties:
      description:
        example: Primary cluster management environment
        type: string
      name:
        example: production
        type: string
    required:
    - name
    type: object
  fleet.PreviewRequest:
    properties:
      all:
        description: All explicitly targets every host; it cannot be combined with
          selector or include.
        type: boolean
      exclude:
        description: Exclude removes hosts by ID or name, always winning over selector
          and include.
        items:
          type: string
        type: array
      include:
        description: Include adds hosts by ID or name regardless of the selector.
        items:
          type: string
        type: array
      selector:
        description: Selector is a label selector, for example environment=production,role
          in (web,db),!canary.
        example: environment=production,role=web
        type: string
    type: object
  host.BulkHostsRequest:
    properties:
      hosts:
        items:
          $ref: '#/definitions/host.Payload'
        type: array
      validate_only:
        description: |-
          ValidateOnly checks records and duplicates without contacting hosts or
          storing anything.
        type: boolean
    type: object
  host.JobsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Job'
        type: array
      hostId:
        type: integer
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  host.LabelPatchRequest:
    properties:
      remove:
        items:
          type: string
        type: array
      set:
        additionalProperties:
          type: string
        type: object
    type: object
  host.Payload:
    properties:
      authMethod:
        enum:
        - PASSWORD
        - PRIVATE_KEY
        example: PRIVATE_KEY
        type: string
      connection:
        example: SSH
        type: string
      environmentId:
        example: 1
        type: integer
      expectedFingerprint:
        example: SHA256:...
        type: string
      hostname:
        example: web-01.example.com
        type: string
      ip:
        example: 192.0.2.10
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: web-01
        type: string
      passphrase:
        example: key-passphrase
        type: string
      port:
        example: 22
        type: integer
      secretData:
        example: '-----BEGIN OPENSSH PRIVATE KEY-----'
        type: string
      username:
        example: deploy
        type: string
    required:
    - authMethod
    - expectedFingerprint
    - name
    - secretData
    - username
    type: object
  job.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Job'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  members.SetRoleRequest:
    properties:
      role:
        enum:
        - owner
        - operator
        - reader
        example: operator
        type: string
    type: object
  runs.SubmitRequest:
    properties:
      all:
        type: boolean
      argv:
        description: |-
          Argv is the program followed by its arguments. There is no shell: each
          element reaches the program as exactly one argument.
        items:
          type: string
        type: array
      concurrency:
        description: Concurrency bounds hosts processed at once (default 5, maximum
          20).
        type: integer
      dryRun:
        description: DryRun validates and plans without storing a run or contacting
          any host.
        type: boolean
      exclude:
        items:
          type: string
        type: array
      expectTargetsHash:
        description: |-
          ExpectTargetsHash, copied from a preview, makes the request fail with 409
          unless it would run on exactly the previewed hosts.
        type: string
      include:
        items:
          type: string
        type: array
      selector:
        description: |-
          Selector, Include, Exclude, and All form the target rule exactly as in the
          target preview. At least one of selector, include, or all is required.
        example: environment=production,role=web
        type: string
      timeoutSeconds:
        description: TimeoutSeconds bounds the command on each host (default 60, maximum
          900).
        type: integer
    type: object
  tokens.CreateRequest:
    properties:
      expiresInHours:
        example: 720
        type: integer
      name:
        example: ci-deploy
        type: string
      role:
        enum:
        - operator
        - reader
        example: reader
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for managing Machinarchy environments, SSH hosts, and job
    history.
  termsOfService: https://github.com/machinarchy/machinarchy
  title: Machinarchy API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an account, returns a JWT, and sets the auth_token
        cookie.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Log in
      tags:
      - Authentication
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
      summary: Log out
      tags:
      - Authentication
  /api/auth/signup:
    post:
      consumes:
      - application/json
      description: Creates an account, returns a JWT, and sets the auth_token cookie.
      parameters:
      - description: Account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Create an account
      tags:
      - Authentication
  /api/v1/audit/events:
    get:
      description: Requires a human workspace owner session; API tokens are refused.
        Events are append-only and never contain credentials. Page backwards by passing
        the smallest id received as before_id.
      parameters:
      - description: Only events with this action, for example member.role_changed
        in: query
        name: action
        type: string
      - description: Only events with a smaller id (paging cursor)
        in: query
        name: before_id
        type: integer
      - description: Page size (default 100, maximum 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AuditEvent'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List audit events
      tags:
      - Audit
  /api/v1/audit/verify:
    get:
      description: Requires a human workspace owner session. Recomputes every event's
        hash and link. A valid result proves no earlier event was edited, removed,
        or reordered; it cannot detect events removed from the end, so record headHash
        somewhere outside the database to detect that.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuditVerification'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Verify the audit trail
      tags:
      - Audit
  /api/v1/environments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Environment'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List environments
      tags:
      - Environments
    post:
      consumes:
      - application/json
      parameters:
      - description: Environment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/environments.EnvSavePayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Environment'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an environment
      tags:
      - Environments
  /api/v1/environments/{id}:
    delete:
      parameters:
      - description: Environment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an environment
      tags:
      - Environments
    put:
      consumes:
      - application/json
      parameters:
      - description: Environment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated environment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/environments.EnvSavePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Environment'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an environment
      tags:
      - Environments
  /api/v1/fleet/targets/preview:
    post:
      consumes:
      - application/json
      description: Resolves a selector with explicit include and exclude lists against
        the workspace inventory and lists the matching hosts (at most 500; total is
        always exact), the hosts removed by the exclude list, and include/exclude
        entries that matched no host. Nothing is contacted or changed, and no credentials
        are returned.
      parameters:
      - description: Target rule
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/fleet.PreviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TargetPreview'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Preview fleet targets
      tags:
      - Fleet
  /api/v1/history:
    get:
      parameters:
      - default: 1h
        description: 'Supported time ranges: 1h, 5h, or 24h'
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.DataPoint'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
