  /api/v1/members:
    get:
      description: Requires a human workspace owner session. API tokens are refused.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.WorkspaceMember'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List workspace members
      tags:
      - Members
  /api/v1/members/{id}/role:
    put:
      consumes:
      - application/json
      description: Requires a human workspace owner session. Takes effect on the member's
        next request, including for API tokens, whose effective role never exceeds
        the membership role. A workspace must always keep at least one owner. The
        change is recorded in the structured server log.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/members.SetRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.WorkspaceMember'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change a member's role
      tags:
      - Members
  /api/v1/tokens:
    get:
      description: Requires a human workspace owner session. Returns metadata for
        tokens created by the current user; plaintext secrets are never returned.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.APIToken'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API tokens
      tags:
      - API tokens
    post:
      consumes:
      - application/json
      description: Requires a human workspace owner session. Tokens are limited to
        operator or reader and their effective access cannot exceed the owner's current
        workspace membership role. Plaintext is returned only in this response.
      parameters:
      - description: Token name, role, and lifetime
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tokens.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.IssuedAPIToken'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an API token
      tags:
      - API tokens
  /api/v1/tokens/{id}:
    delete:
      description: Requires a human workspace owner session. The revoked token is
        rejected on its next request.
      parameters:
      - description: API token ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an API token
      tags:
      - API tokens
