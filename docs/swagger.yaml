  /api/v1/hosts:
    get:
      description: Optionally filters with a label selector such as `environment=production,role
        in (web,db),!canary`. Built-in fields are name, hostname, address, status,
        connection, and environment; any other key is a label. Values may use the
        wildcards * and ?. An empty or invalid selector is rejected rather than treated
        as "all".
      parameters:
      - description: Label selector
        in: query
        name: selector
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Host'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List hosts
      tags:
      - Hosts
    post:
      consumes:
      - application/json
      description: Registers a host after validating SSH connectivity and the expected
        host-key fingerprint. SecretData contains the SSH password or private key
        and is never returned.
      parameters:
      - description: Host connection details; provide either ip or hostname. SecretData
          is the SSH password or private key and is never returned.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/host.Payload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Host'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "412":
          description: Precondition Failed
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a host
      tags:
      - Hosts
  /api/v1/hosts/{id}:
    delete:
      parameters:
      - description: Host ID
        in: path
