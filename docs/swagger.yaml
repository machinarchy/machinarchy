  /api/v1/jobs:
    get:
      parameters:
      - description: Filter by host ID
        in: query
        name: hostId
        type: integer
      - default: 10
        description: Page size (1-100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
